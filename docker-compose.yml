name: brewlite-assignment
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brewlite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brewlite}
      POSTGRES_DB: ${POSTGRES_DB:-brewlite}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-brewlite}:${POSTGRES_PASSWORD:-brewlite}@db:5432/${POSTGRES_DB:-brewlite}?schema=public
      JWT_SECRET: ${JWT_SECRET:-local-only-change-this-before-production}
      NODE_ENV: production
      PORT: 3001
      CORS_ORIGIN: http://localhost:${WEB_PORT:-3000}
      PAYMENT_LATENCY_MS: 300
      PAYMENT_FAILURE_RATE: 0
      RUN_MIGRATIONS: 'true'
      SEED_ON_START: ${SEED_ON_START:-true}
    ports:
      - '127.0.0.1:${API_PORT:-3001}:3001'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:3001
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
